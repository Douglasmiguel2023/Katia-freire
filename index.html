<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Katia Freire — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --oat:#FAF6EE;
    --oat-light:#FDFBF7;
    --oat-deep:#F1E9D8;
    --sand:#C9A98A;
    --taupe:#B39B88;
    --brown:#5C4637;
    --brown-deep:#433126;
    --gold:#A98548;
    --gold-light:#D6BA8A;
    --cream:#FBF7EF;
    --btn-bg:#EFE4D0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Montserrat',sans-serif;
    color:var(--brown-deep);
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(900px 650px at -15% 35%, rgba(201,169,138,.22), transparent 60%),
      radial-gradient(800px 600px at 110% 78%, rgba(169,133,72,.14), transparent 60%),
      linear-gradient(168deg, var(--oat-light) 0%, var(--oat) 46%, var(--oat-deep) 100%);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- fundo com movimento suave ---------- */
  .bg-motion{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-motion .glow{
    position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;
    animation:drift 18s ease-in-out infinite alternate;
  }
  .glow.g1{width:420px;height:420px;left:-140px;top:-120px;background:rgba(255,255,255,.85)}
  .glow.g2{width:360px;height:360px;right:-120px;top:34%;background:rgba(214,186,138,.65);animation-delay:-6s;animation-duration:22s}
  .glow.g3{width:300px;height:300px;left:22%;bottom:-140px;background:rgba(179,155,136,.45);animation-delay:-12s}
  @keyframes drift{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(46px,34px) scale(1.08)}
  }
  .bg-lines{position:absolute;inset:-20% -10%;opacity:.5;
    background:
      repeating-linear-gradient(115deg, transparent 0 118px, rgba(255,255,255,.55) 118px 119px, transparent 119px 236px),
      repeating-linear-gradient(115deg, transparent 0 197px, rgba(169,133,72,.35) 197px 198px, transparent 198px 394px);
    animation:linesMove 26s linear infinite;
  }
  @keyframes linesMove{from{transform:translateX(0)}to{transform:translateX(120px)}}

  /* ---------- pétalas ---------- */
  #petals{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .petal{
    position:absolute;top:-6vh;
    background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(230,218,200,.75) 55%, rgba(201,169,138,.65));
    border-radius:82% 4% 82% 4%;
    box-shadow:0 2px 8px rgba(92,70,55,.10);
    animation:fall linear infinite;
    will-change:transform;
  }
  @keyframes fall{
    0%{transform:translate3d(0,-6vh,0) rotate(0deg)}
    25%{transform:translate3d(3.2vw,26vh,0) rotate(95deg)}
    50%{transform:translate3d(-2.4vw,54vh,0) rotate(185deg)}
    75%{transform:translate3d(2.6vw,80vh,0) rotate(272deg)}
    100%{transform:translate3d(-1.6vw,108vh,0) rotate(360deg)}
  }

  /* ---------- layout ---------- */
  .page{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:20px 20px 44px;display:flex;flex-direction:column;align-items:center}

  .brand{text-align:center;animation:rise .9s ease both}
  .brand h1{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(27px,7.6vw,36px);letter-spacing:.22em;line-height:1.05;
    color:var(--brown);
    text-shadow:0 1px 0 rgba(255,255,255,.65);
  }
  .brand .rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px auto 7px;width:min(210px,58vw)}
  .brand .rule::before,.brand .rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .brand .rule span{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex:none}
  .brand p{font-size:9.5px;font-weight:500;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
  .brand .handle{margin-top:6px;font-size:11px;letter-spacing:.1em;color:var(--taupe);font-weight:500;text-transform:none}

  /* ---------- arco / carrossel ---------- */
  .stage{position:relative;width:100%;display:flex;justify-content:center;margin-top:18px;animation:rise .9s .12s ease both;isolation:isolate}
  .arch-wrap{position:relative;width:min(200px,54vw);z-index:3}
  .arch{
    position:relative;
    border-radius:50%;
    padding:12px;
    background:linear-gradient(160deg, rgba(255,255,255,.35), rgba(201,169,138,.15));
    border:1.5px solid var(--gold);
    box-shadow:0 0 55px rgba(214,186,138,.50), 0 24px 48px rgba(92,70,55,.20), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .arch::before{
    content:"";position:absolute;inset:7px;border-radius:inherit;
    border:1.5px solid var(--gold);pointer-events:none;z-index:4;
  }
  .arch .diamond{
    position:absolute;top:46%;width:17px;height:17px;z-index:5;
    background:#EFE4D0;border:1.5px solid var(--gold);transform:rotate(45deg);
    box-shadow:0 0 16px rgba(214,186,138,.95);
  }
  .diamond.dl{left:-9px}.diamond.dr{right:-9px}
  .viewport{position:relative;border-radius:50%;overflow:hidden;aspect-ratio:3/4;background:var(--oat-deep)}
  .viewport img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
    opacity:0;transform:scale(1.04);transition:opacity .8s ease, transform 1.4s ease;
  }
  .viewport img.active{opacity:1;transform:scale(1)}
  .nav-arrow{
    position:absolute;top:44%;z-index:6;width:46px;height:46px;border-radius:50%;
    border:1.5px solid var(--gold);background:rgba(251,247,239,.22);backdrop-filter:blur(3px);
    color:var(--gold);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px rgba(214,186,138,.35);
    transition:transform .25s ease, background .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-arrow:hover{background:rgba(255,255,255,.5);transform:scale(1.07)}
  .nav-arrow:active{transform:scale(.96)}
  .nav-arrow.prev{left:-8px}.nav-arrow.next{right:-8px}
  @media(min-width:480px){.nav-arrow.prev{left:-58px}.nav-arrow.next{right:-58px}}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .dots button{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold);background:transparent;cursor:pointer;padding:0;transition:all .3s}
  .dots button.active{background:var(--gold);width:22px;border-radius:99px}

  /* ---------- faixas rolando ---------- */
  .bands{position:absolute;left:calc(50% - 50vw);bottom:34px;width:100vw;height:100px;pointer-events:none}
  .band{
    position:absolute;left:-4%;width:108%;overflow:hidden;white-space:nowrap;
    padding:14px 0;
  }
  .band.back{
    top:0;transform:rotate(1.8deg);z-index:1;
    background:linear-gradient(180deg, #C8A87C, #B9976B);
    box-shadow:0 10px 22px rgba(92,70,55,.22);
    filter:blur(1.4px);
  }
  .band.front{
    top:42px;transform:rotate(-1.6deg);z-index:6;
    background:linear-gradient(180deg, #E3CB9C, var(--gold-light) 55%, #CBAE7C);
    box-shadow:0 14px 28px rgba(92,70,55,.28);
  }
  .band .track{display:inline-flex;animation:scrollX 30s linear infinite;will-change:transform}
  .band.back .track{animation-duration:38s;animation-direction:reverse}
  .band span{
    font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.34em;
    font-size:17px;padding-right:.6em;text-transform:uppercase;
  }
  .band.front span{color:var(--brown-deep)}
  .band.back span{color:var(--brown-deep)}
  @keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ---------- botões ---------- */
  @property --btn-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
  .links{width:100%;max-width:430px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .link-btn{
    position:relative;display:flex;align-items:center;gap:12px;width:100%;
    padding:11px 18px 11px 13px;border-radius:999px;text-decoration:none;cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,0) 46%), var(--btn-bg);
    border:none;
    box-shadow:0 10px 20px rgba(92,70,55,.13), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -6px 12px rgba(201,169,138,.18);
    color:var(--brown-deep);
    transition:transform .25s ease, box-shadow .25s ease;
    animation:rise .8s ease both;
    -webkit-tap-highlight-color:transparent;
    font-family:inherit;text-align:left;
  }
  .links .link-btn:nth-child(1){animation-delay:.22s}
  .links .link-btn:nth-child(2){animation-delay:.32s}
  .links .link-btn:nth-child(3){animation-delay:.42s}
  /* contorno leve em movimento: brilho branco-dourado percorrendo a borda */
  .link-btn::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;
    background:conic-gradient(from var(--btn-angle),
      rgba(255,255,255,.95) 0deg,
      rgba(214,186,138,.9) 55deg,
      rgba(255,255,255,.28) 130deg,
      rgba(169,133,72,.45) 215deg,
      rgba(255,255,255,.35) 290deg,
      rgba(255,255,255,.95) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:btnContour 5.5s linear infinite;
    pointer-events:none;
  }
  @keyframes btnContour{to{--btn-angle:360deg}}
  .link-btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px rgba(92,70,55,.18), inset 0 1px 0 rgba(255,255,255,.9)}
  .link-btn:active{transform:translateY(0) scale(.99)}
  .icon-circle{
    flex:none;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);
  }
  .icon-circle svg{width:18px;height:18px}
  .link-btn .label{flex:1;min-width:0}
  .link-btn .label strong{
    display:block;font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:16.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--brown);
    line-height:1.15;
  }
  @media(max-width:480px){
    .link-btn .label strong{font-size:13.5px;letter-spacing:.06em}
    .link-btn .label small{font-size:9.5px;letter-spacing:.05em}
  }
  .link-btn .label small{display:block;margin-top:1px;font-size:10px;letter-spacing:.07em;color:var(--taupe);font-weight:500}
  .link-btn .arrow{flex:none;font-size:17px;color:var(--gold);transition:transform .25s ease}
  .link-btn:hover .arrow{transform:translateX(4px)}

  .toast{
    margin-top:14px;font-size:12px;letter-spacing:.05em;color:var(--brown);
    background:rgba(255,255,255,.65);border:1px solid var(--gold-light);border-radius:99px;
    padding:9px 16px;opacity:0;transform:translateY(6px);transition:all .35s ease;pointer-events:none;text-align:center;
  }
  .toast.show{opacity:1;transform:translateY(0)}

  /* ---------- rodapé ---------- */
  footer{margin-top:22px;text-align:center;animation:rise .9s .5s ease both}
  footer .impact{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:clamp(19px,5vw,23px);line-height:1.3;color:var(--brown);
    max-width:380px;margin:0 auto;
  }
  footer .impact::before,footer .impact::after{content:"";display:block;width:44px;height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  footer .impact::before{margin-bottom:12px}
  footer .impact::after{margin-top:12px}
  footer .foot-name{
    margin-top:14px;font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:16px;letter-spacing:.28em;color:var(--brown);
  }
  footer .foot-sub{margin-top:5px;font-size:8.5px;font-weight:500;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion: reduce){
    .bg-lines,.bg-motion .glow,.band .track,.link-btn::before{animation:none}
    .petal{display:none}
    *{transition:none!important}
  }
</style>
</head>
<body>

  <div class="bg-lines"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<script>
(function(){
  // Faixas
  var phrase = "Tráfego Pago \u2726 Posicionamento \u2726 Marketing e Vendas \u2726 Projetos Estratégicos \u2726 Solicite uma Análise \u2726 ";
  var html = "";
  for (var r=0;r<4;r++){ html += "<span>" + phrase + "</span>"; }
  document.querySelectorAll("[data-band]").forEach(function(t){ t.innerHTML = html; });

  // Carrossel
  var imgs = Array.prototype.slice.call(document.querySelectorAll("#viewport img"));
  var dotsBox = document.getElementById("dots");
  var idx = 0, timer = null;
  imgs.forEach(function(_, i){
    var b = document.createElement("button");
    b.setAttribute("aria-label", "Foto " + (i+1));
    if (i===0) b.className = "active";
    b.addEventListener("click", function(){ go(i); restart(); });
    dotsBox.appendChild(b);
  });
  var dots = Array.prototype.slice.call(dotsBox.children);
  function go(n){
    imgs[idx].classList.remove("active"); dots[idx].classList.remove("active");
    idx = (n + imgs.length) % imgs.length;
    imgs[idx].classList.add("active"); dots[idx].classList.add("active");
  }
  function restart(){ clearInterval(timer); timer = setInterval(function(){ go(idx+1); }, 5000); }
  document.getElementById("prevBtn").addEventListener("click", function(){ go(idx-1); restart(); });
  document.getElementById("nextBtn").addEventListener("click", function(){ go(idx+1); restart(); });
  var startX = null, vp = document.getElementById("viewport");
  vp.addEventListener("touchstart", function(e){ startX = e.touches[0].clientX; }, {passive:true});
  vp.addEventListener("touchend", function(e){
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 36){ go(dx < 0 ? idx+1 : idx-1); restart(); }
    startX = null;
  }, {passive:true});
  restart();

  // WhatsApp — número ainda não informado: avisa na página, sem destino falso
  var toast = document.getElementById("toast"), toastTimer = null;
  document.getElementById("whatsBtn").addEventListener("click", function(){
    toast.textContent = "WhatsApp em breve — canal sendo ativado.";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 3200);
  });

  // Pétalas (leve no celular)
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce){
    var box = document.getElementById("petals");
    var count = window.innerWidth < 560 ? 9 : 14;
    for (var i=0;i<count;i++){
      var p = document.createElement("div");
      p.className = "petal";
      var size = 9 + Math.random()*11;
      p.style.width = size + "px";
      p.style.height = size*1.35 + "px";
      p.style.left = (Math.random()*100) + "vw";
      p.style.animationDuration = (11 + Math.random()*10) + "s";
      p.style.animationDelay = (-Math.random()*18) + "s";
      p.style.opacity = (0.45 + Math.random()*0.45).toFixed(2);
      box.appendChild(p);
    }
  }
})();
</script>
